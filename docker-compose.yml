services:
  chatgpt2api:
    image: ghcr.io/chuanghiduoc/chatgpt2api-cf:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      # Required: a public VPS must not run an open proxy.
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
      DEVICE_POOL_SIZE: ${DEVICE_POOL_SIZE:-3}
    volumes:
      - chatgpt2api-data:/data

volumes:
  chatgpt2api-data:
